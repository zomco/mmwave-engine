name: CI

on:
  push:
    branches: [main]
    paths-ignore: &engine-ignore
      - 'AGENTS.md'
      - 'AGENTS_CN.md'
      - 'README.md'
      - 'README_CN.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *engine-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import mmwave_engine; assert mmwave_engine.__version__"
